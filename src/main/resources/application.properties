spring.application.name=ahorra
app.title=${APP_TITLE:/api/v1}
server.port=${PORT:2050}
spring.datasource.url=jdbc:mysql://localhost:3306/ahorra_tutorial_db?serverTimezone=Africa/Lagos
spring.datasource.username=root
spring.datasource.password=${MYSQL_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#Cors Config
app.cors.extra.origins=${APP_CORS_EXTRA_ORIGINS:}

#Email Config
app.email.provider=${EMAIL_PROVIDER:mailjet}
app.email.log-to-console=${EMAIL_LOG_TO_CONSOLE:true}
mailjet.api-key=${MAILJET_API_KEY:}
mailjet.secret-key=${MAILJET_SECRET_KEY:}
mailjet.sender-email=${MAILJET_SENDER_EMAIL:}
mailjet.sender-name=${MAILJET_SENDER_NAME:}

#JWT Secret
app.jwt.secret=${JWT_SECRET:}
app.jwt.issuer=${JWT_ISSUER:ahorra}
app.jwt.access-ttl-seconds=${JWT_ACCESS_TTL_SECONDS:900}
app.jwt.refresh-ttl-seconds=${JWT_REFRESH_TTL_SECONDS:2592000}

#Redis config
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
Spring.data.redis.database=${REDIS_DATABASE:0}


#Time Zone
app.timezone=${APP_TIMEZONE:Africa/Lagos}

#LLM
groq.api-key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL:openai/gpt-oss-120b}
groq.base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1}
groq.timeout-seconds=${GROQ_TIMEOUT_SECONDS:20}

#FOR VOICE TRANSCRIPTION
groq.transcription-model=${GROQ_TRANSCRIPTION_MODEL:whisper-large-v3-turbo}
groq.transcription-timeout-seconds=${GROQ_TRANSCRIPTION_TIMEOUT_SECONDS:30}

#ROME FOR A ONE MINUTE RECORDING
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=4MB

