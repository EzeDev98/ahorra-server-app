spring.application.name=ahorra
app.title=${APP_TITLE:/api/v1}
server.port=${PORT:2050}
spring.datasource.url=jdbc:mysql://localhost:3306/ahorra_tutorial_db?serverTimezone=Africa/Lagos
spring.datasource.username=root
spring.datasource.password=${MYSQL_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#Cors Config
app.cors.extra.origins=${APP_CORS_EXTRA_ORIGINS:}

#Email Config
app.email.provider=${EMAIL_PROVIDER:mailjet}
app.email.log-to-console=${EMAIL_LOG_TO_CONSOLE:true}
mailjet.api-key=${MAILJET_API_KEY:}
mailjet.secret-key=${MAILJET_SECRET_KEY:}
mailjet.sender-email=${MAILJET_SENDER_EMAIL:}
mailjet.sender-name=${MAILJET_SENDER_NAME:}
